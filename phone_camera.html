<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exercise camera</title>
<style>
body{font:17px system-ui,sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:24px;line-height:1.5}main{max-width:640px;margin:auto}h1{font-size:28px;text-wrap:balance}p{text-wrap:pretty}video{width:100%;max-height:45vh;background:#0f172a;border-radius:12px}button,select,input{font:inherit;padding:12px;border:1px solid #64748b;border-radius:8px;margin:4px 0;max-width:100%;box-sizing:border-box}button{background:#0f766e;color:white;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0f766e;outline-offset:3px}.controls{display:flex;gap:12px;flex-wrap:wrap}#count{font-size:48px;font-variant-numeric:tabular-nums;margin:8px 0}label{display:block}#message{min-height:3em}small{display:block;color:#475569}
</style>
<main><h1 id="exercise">Squats</h1><p id="instructions">Stand sideways with hip, knee and ankle visible. Touch the D2 sensor to switch to curls.</p>
<label for="code">Session code</label><input id="code" type="password" autocomplete="off" placeholder="Paste code from laptop">
<label for="camera">Camera</label><select id="camera"><option value="environment">Rear camera</option><option value="user">Front camera</option></select>
<video id="preview" autoplay playsinline muted></video>
<div class="controls"><button id="start">Start camera</button><button id="stop" disabled>Stop camera</button><button id="reset">Reset count</button></div>
<p id="count">0 attempts</p><p id="passed">0 met targets</p><p id="message" role="status" aria-live="polite">Ready to connect.</p><p id="feedback" role="status" aria-live="polite"></p><p id="targets"></p><p id="warning" role="status" aria-live="polite"></p>
<small>Keep Safari open. Images are processed on your laptop and are not recorded. Locking your phone pauses the camera.</small></main>
<script>
const $=id=>document.getElementById(id), video=$('preview'), canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d'); let stream=null, running=false, generation=0, busy=false;
$('code').value=new URLSearchParams(location.hash.slice(1)).get('token')||'';
history.replaceState(null,'',location.pathname);
async function request(path,body){
 const abort=new AbortController(), timer=setTimeout(()=>abort.abort(),15000);
 try{const r=await fetch(path,{method:'POST',headers:{'X-Session-Code':$('code').value,'Content-Type':path==='/frame'?'image/jpeg':'text/plain'},body,signal:abort.signal});
 if(!r.ok){const e=new Error(r.status===401?'Check the session code from your laptop.':r.status===409?'Another frame is processing. Try again.':'Laptop returned error '+r.status);e.status=r.status;throw e;}
 return await r.json();}finally{clearTimeout(timer);}
}
function halt(message){running=false;generation++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('start').disabled=false;$('stop').disabled=true;$('camera').disabled=false;$('message').textContent=message;}
function show(data){
 const squat=data.mode==='SQUAT';
 $('exercise').textContent=squat?'Squats':'Curls';
 $('instructions').textContent=squat?'Stand sideways with hip, knee and ankle visible. Touch D2 to switch to curls.':'Stand sideways with shoulder, elbow and wrist visible. Extend your arm first. Touch D2 to switch to squats.';
 $('count').textContent=data.attempts+' attempts';$('passed').textContent=data.passed+' met targets';
 const states={READY:squat?'Stand to begin':'Extend arm to begin',START:'Ready for next rep',MOVING:'Movement in progress',LOST:'Tracking lost / camera paused'};
 $('message').textContent=(states[data.status]||data.status)+(data.angle===null?'':' · '+(squat?'Knee ':'Elbow ')+data.angle+'°');
 const reasons={NONE:'',OK:'Targets met',RANGE:'Missed range target',FAST:'Rep too fast',SLOW:'Rep too slow',RANGE_FAST:'Missed range + too fast',RANGE_SLOW:'Missed range + too slow'};
 $('feedback').textContent=(data.result==='NONE'?'':'Last attempt: ')+(reasons[data.result]||'')+(data.duration===null?'':' · '+data.duration.toFixed(1)+' s');
 const t=data.targets;
 if(t)$('targets').textContent=`Targets: extend to ${t.start_angle}°; bend to ${t.target_angle}° or less; whole rep ${t.min_seconds}–${t.max_seconds} seconds. Prototype settings, not a full form assessment.`;
 $('warning').textContent=data.warning||'';
}
async function pump(id){
 if(!running||id!==generation)return;
 if(busy){setTimeout(()=>pump(id),100);return;}busy=true;
 try{
 if(!video.videoWidth){setTimeout(()=>pump(id),100);return;}
 const scale=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight));
 canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);ctx.drawImage(video,0,0,canvas.width,canvas.height);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.75));
 if(!blob)throw new Error('Could not capture an image. Restart the camera.');
 const data=await request('/frame',blob);
 if(id!==generation)return;
 show(data);
 setTimeout(()=>pump(id),80);
 }catch(e){if(id===generation){if(e.status===409)setTimeout(()=>pump(id),200);else halt('Connection stopped: '+e.message);}}finally{busy=false;}
}
$('start').onclick=async()=>{
 if(!$('code').value){$('message').textContent='Paste the session code printed on the laptop.';return;}
 if(!navigator.mediaDevices?.getUserMedia){$('message').textContent='Camera requires trusted HTTPS. Complete the certificate setup first.';return;}
 $('start').disabled=true;const id=++generation;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:$('camera').value},width:{ideal:640},height:{ideal:480}},audio:false});
 if(id!==generation){stream.getTracks().forEach(t=>t.stop());stream=null;return;}
 video.srcObject=stream;await video.play();running=true;$('stop').disabled=false;$('camera').disabled=true;$('message').textContent='Connecting…';pump(id);
 }catch(e){halt('Camera could not start: '+e.message);}
};
$('stop').onclick=()=>halt('Camera stopped.');
$('reset').onclick=async()=>{try{show(await request('/reset',''));}catch(e){$('message').textContent=e.message;}};
setInterval(async()=>{if(busy||!$('code').value||document.hidden)return;try{const data=await request('/status','');if(!busy)show(data);}catch(e){if(!running&&e.status!==409)$('warning').textContent='Receiver unavailable: '+e.message;}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)halt('Camera paused. Tap Start camera to resume.');});
window.addEventListener('pagehide',()=>halt('Camera stopped.'));
</script></html>
